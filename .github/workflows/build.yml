name: Build Hokm APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project
        run: |
          echo "Files in repo:"
          find . -type f -not -path "./.git/*" | head -50
          ZIP=$(find . -iname "*.zip" -not -path "./.git/*" | head -1)
          if [ -n "$ZIP" ]; then
            echo "Found zip: $ZIP"
            mkdir -p src_unzipped
            unzip -q "$ZIP" -d src_unzipped
          fi
          SETTINGS=$(find . \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -not -path "./.git/*" | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: project files not found in the repo"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> $GITHUB_ENV
          echo "Project dir: $(dirname "$SETTINGS")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --console=plain

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find "$PROJECT_DIR" -path "*build/outputs/apk/debug/*.apk" | head -1)
          if [ -z "$APK" ]; then echo "ERROR: APK not found"; exit 1; fi
          cp "$APK" dist/HokmOnline.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HokmOnline-apk
          path: dist/HokmOnline.apk
